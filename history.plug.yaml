name: history
requiredPermissions:
  - shell
assets:
  - "assets/**/*.*"

functions:
  historyShow:
    path: history.ts:historyShow
    command:
      name: "History: view file history"
  historyClose:
    path: history.ts:historyClose
    command:
      name: "History: close"
  historyToggle:
    path: history.ts:historyToggle
    command:
      name: "History: toggle open/close"
  selectVersion:
    path: history.ts:selectVersion

  readFile:
    path: operations.ts:readFile
    pageNamespace:
      pattern: "^@History"
      operation: readFile
  writeFile:
    path: operations.ts:writeFile
    pageNamespace:
      pattern: "^@History"
      operation: writeFile
  getFileMeta:
    path: operations.ts:getFileMeta
    pageNamespace:
      pattern: "^@History"
      operation: getFileMeta
